# SpringBoot project configuration
spring:
  thymeleaf:
    cache: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/seckill?useUnicode=true&characterEncoding=utf-8&useSSL=true
    username: your_mysql_username
    password: your_mysql_password
    hikari:
      pool-name: Hsp_Hikari_Poll
      minimum-idle: 5
      idle-timeout: 60000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 180000
      connection-timeout: 30000
      connection-test-query: select 1

  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 10000ms
    jedis:
      pool:
        max-active: 12
        max-wait: 10000ms
        max-idle: 200
        min-idle: 5

  rabbitmq:
    host: 127.0.0.1
    username: your_rabbitmq_username
    password: your_rabbitmq_password
    virtual-host: /
    port: 5672
    listener:
      simple:
        concurrency: 10
        max-concurrency: 10
        prefetch: 1
        auto-startup: true
        default-requeue-rejected: true
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        max-interval: 10000ms
        multiplier: 1

mybatis-plus:
  mapper-locations: classpath*:/mapper/*Mapper.xml
  type-aliases-package: com.hspedu.seckill.pojo

logging:
  level:
    com.hspedu.seckill.mapper: debug
